backbone_name: Qwen/Qwen3-0.6B-Base
max_length: 128
batch_size: 8
grad_accum_steps: 4
max_epochs: 300
early_stopping_patience: 10
early_stopping_min_delta: 0.0001
val_ratio: 0.1
rng_seed: 42
learning_rate: 0.0002
weight_decay: 0.01
layer_mix_count: 4
dropout: 0.1
big_head: false
train_backbone: false
unfreeze_last_n_layers: 0
output_dir: artifacts

loss_weights:
  subject_material_template: 1.0
  reaction_reaction_template: 1.0
  release_release_template: 1.0
  motion_motion_template: 1.0
  motion_motion_direction: 1.0
  motion_origin: 1.0
  motion_target: 1.0
  politeness: 1.0

dataset:
  source_paths:
    - data/source/spell_to_model_socket.jsonl
    - data/source/random_spell_to_model_socket.jsonl
    - data/source/random_model_socket_to_spell.jsonl